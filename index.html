    <script>
      (function () {
        try {
          // Mirrors src/data/themePresets.ts so the first paint already has the right ground.
          var grounds = {
            signal: ['#0A0A0B', '#F4F2EE'],
            ocean: ['#07090C', '#F1F4F6'],
            royal: ['#0A090D', '#F3F1F6'],
            emerald: ['#070B09', '#F0F4F1'],
            sunset: ['#0C0908', '#F6F1EC'],
            monochrome: ['#0A0A0A', '#F4F4F2'],
            cyber: ['#050608', '#EFF4F5'],
          };
          var raw = localStorage.getItem('portfolio-theme');
          var saved = raw ? JSON.parse(raw) : null;
          var state = saved && saved.state ? saved.state : null;
          // Pre-v3 saves (version 0) are migrated to Signal + dark by the store; match that here.
          var legacy = !saved || !saved.version;
          var preset = !legacy && state && grounds[state.preset] ? state.preset : 'signal';
          var appearance = state && state.appearance ? state.appearance : 'dark';
          if (legacy && appearance === 'system') appearance = 'dark';
          var isDark =
            appearance === 'dark' ||
            (appearance === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.setAttribute('data-theme', isDark ? 'dark' : 'light');
          root.style.setProperty('--background', grounds[preset][isDark ? 0 : 1]);
          root.style.setProperty('--foreground', isDark ? '#EDEDED' : '#0A0A0B');
          if (state && state.recruiterMode) root.setAttribute('data-recruiter', '');
          if (sessionStorage.getItem('v3-booted')) root.setAttribute('data-booted', '');
        } catch (e) {}
      })();
    </script>
