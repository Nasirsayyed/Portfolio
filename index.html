    <script>
      (function () {
        try {
          var darkBg = {
            ocean: '#070c17',
            royal: '#0b0817',
            emerald: '#061412',
            sunset: '#150907',
            monochrome: '#0a0a0b',
            cyber: '#05050a',
          };
          var darkFg = {
            ocean: '#e8edf7',
            royal: '#ece9f9',
            emerald: '#e4f5ee',
            sunset: '#fbe9e1',
            monochrome: '#f4f4f5',
            cyber: '#e9e8fb',
          };
          var raw = localStorage.getItem('portfolio-theme');
          var state = raw ? JSON.parse(raw).state : null;
          var appearance = (state && state.appearance) || 'system';
          var preset = (state && state.preset) || 'ocean';
          var isDark =
            appearance === 'dark' ||
            (appearance === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.setProperty('--background', darkBg[preset] || darkBg.ocean);
            document.documentElement.style.setProperty('--foreground', darkFg[preset] || darkFg.ocean);
          }
        } catch (e) {}
      })();
    </script>
